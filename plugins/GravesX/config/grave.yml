      # Messages and formats for various interactions and events.
      message:
        # Prefix for messages.
        prefix: "&c[Graves] &r"
        # Messages for different interactions.
        looted: "Bạn đã lấy đồ từ mộ của &c%owner_name%&r tại &c%x%&rx, &c%y%&ry, &c%z%&rz trong &c%world_formatted%&r."
        experience: "Lấy được &c%level% &r cấp độ từ mộ."
        empty: "Bạn không có ngôi mộ nào."
        death: "Bạn đã bị giết ở &c%world_formatted% &r bởi &c%killer_name%&r."
        block: "Mộ được tạo ở &c%x%&rx, &c%y%&ry, &c%z%&rz trong &c%world_formatted%&r."
        timeout: "Mộ của bạn ở &c%x%&rx, &c%y%&ry, &c%z%&rz trong &c%world_formatted%&r đã hết thời gian với &c%item% &rdồ và &c%experience% &rKinh nghiệm."
        ignore: "Mộ không được tạo vì bạn chết ở &c%name%&r."
        max: "Mộ không được tạo, bạn đã đạt đến giới hạn tối đa."
