      #######
      # GUI configuration for different interfaces.
      gui:
        grave:
          # Title of the grave GUI.
          title: "Mộ của %owner_name%"

        menu:
          list:
            item:
              # Options for menu item.
              block: đúng
              material: CHEST
            # Title for the grave list menu.
            title: "Danh sách Mộ"
            function: "menu"
            name: "Mộ"
            glow: sai
            model-data: -1
            empty: "Bạn không có ngôi mộ nào."
