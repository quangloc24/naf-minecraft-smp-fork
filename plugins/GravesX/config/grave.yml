        distance: "Bạn cách &c%distance% &r khối."
        distance-world: "Không thể đo khoảng cách, thế giới sai."
        teleport: "Bạn đã dịch chuyển đến mộ của mình."
        teleport-waiting: "Đang dịch chuyển đến mộ..."
        teleport-top: "Mộ ở vị trí không an toàn, bạn đã được dịch chuyển đến gần đó."
        teleport-failure: "Dịch chuyển thất bại, vị trí dịch chuyển không an toàn."
