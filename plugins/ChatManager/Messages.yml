#=================================================================================================#
#
# Information:
#
#   Color Codes are supported with the "&" character.
#    - To view a list of COLOR CODES you can do /Colors in-game.
#    - To view a list of FORMAT CODES you can do /Formats in-game.
#
#=================================================================================================#
Message:
  Prefix: "&6[ChatManager] &r"
  No_Permission: "{prefix}&cBạn không có quyền để làm điều này."
  Player_Not_Found: "{prefix}&7Người chơi &c{target} &7không được tìm thấy."
  Reload: "{prefix}&aCấu hình đã được tải lại."
  Reload: "{prefix}&aConfig has been reloaded."
Anti_Advertising:
#=================================================================================================#
# Anti-Advertising Messages
#=================================================================================================#
  Chat:
    Message: "{prefix}&cQuảng cáo không được phép trong chat. Nhân viên đã được thông báo."
    Notify_Staff_Format: "&7[Anti-Advertise Chat] &f{player}: &7{message}"
  Commands:
    Message: "{prefix}&cQuảng cáo không được phép trong lệnh. Nhân viên đã được thông báo."
    Notify_Staff_Format: "&7[Anti-Advertise Commands] &f{player}: &7{message}"
  Signs:
    Message: "{prefix}&cQuảng cáo không được phép trên biển hiệu. Nhân viên đã được thông báo."
    Notify_Staff_Format: "&7[Anti-Advertise Signs] &f{player}: &7{message}"
  
Anti_Bot:
#=================================================================================================#
# Anti-Bot Messages
#=================================================================================================#
  Deny_Chat_Message: "{prefix}&cBạn phải di chuyển một khối trước khi nói chuyện trong chat."
  Deny_Command_Message: "{prefix}&cBạn phải di chuyển một khối trước khi thực thi lệnh."
  
Anti_Caps:
#=================================================================================================#
# Anti-Caps Message
#=================================================================================================#
  Message_Chat: "{prefix}&cVui lòng không sử dụng chữ in hoa trong chat."
  Message_Commands: "{prefix}&cVui lòng không sử dụng chữ in hoa trong lệnh."
  
Anti_Spam:
#=================================================================================================#
# Anti-Spam Messages
#=================================================================================================#
  Chat:
    Repetitive_Message: "{prefix}&cVui lòng không lặp lại cùng một tin nhắn."
    Delay_Message: "{prefix}&7Vui lòng chờ &c{Time} giây &7trước khi gửi tin nhắn khác."
  Command:
    Repetitive_Message: "{prefix}&cVui lòng không lặp lại cùng một lệnh."
    Delay_Message: "{prefix}&7Vui lòng chờ &c{Time} giây &7trước khi gửi lệnh khác."
    Delay_Message: "{prefix}&7Please wait &c{Time} seconds &7before sending another command."
Anti_Swear:
#=================================================================================================#
# Anti-Swear Messages
#=================================================================================================#
  Chat:
    Message: "{prefix}&cVui lòng không chửi thề trong chat."
    Notify_Staff_Format: "&7[Anti-Swear Chat] &f{player}: &7{message}"
  Commands:
    Message: "{prefix}&cVui lòng không chửi thề trong lệnh."
    Notify_Staff_Format: "&7[Anti-Swear Commands] &f{player}: &7{message}"
  Signs:
    Message: "{prefix}&cVui lòng không chửi thề trên biển hiệu."
    Notify_Staff_Format: "&7[Anti-Swear Signs] &f{player}: &7{message}"
  Blacklisted_Word:
    Added: "{prefix}&7Bạn đã thêm từ &c{word} &7vào danh sách đen từ cấm."
    Exists: "{prefix}&7Từ &c{word} &7đã được thêm vào danh sách đen từ cấm."
    Removed: "{prefix}&7Bạn đã xóa từ &c{word} &7khỏi danh sách đen từ cấm."
    Not_Found: "{prefix}&7Từ &c{word} &7không có trong danh sách đen từ cấm."
  Whitelisted_Word:
    Added: "{prefix}&7Bạn đã thêm từ &c{word} &7vào danh sách trắng từ cấm."
    Exists: "{prefix}&7Từ &c{word} &7đã được thêm vào danh sách trắng từ cấm."
    Removed: "{prefix}&7Bạn đã xóa từ &c{word} &7khỏi danh sách trắng từ cấm."
    Not_Found: "{prefix}&7Từ &c{word} &7không có trong danh sách trắng từ cấm."
    
Anti_Unicode:
#=================================================================================================#
# Anti-Unicode Messages
#=================================================================================================#
  Message: "{prefix}&cVui lòng không sử dụng ký tự đặc biệt trong chat."
  Notify_Staff_Format: "&7[Anti-Unicode] &f{player}: &7{message}"
    
Auto_Broadcast:
#=================================================================================================#
# Auto-Broadcast Messages
#=================================================================================================#
  List: "&c{section}'s &7tin nhắn tự động phát sóng:"
  Added: "{prefix}&r{message} &7đã được thêm vào tin nhắn &c{section}&7!"
  Created: "{prefix}&7Đã tạo thế giới &c'%world%' &7với tin nhắn &r{message}&7."
  
Banned_Commands:
#=================================================================================================#
# Banned Commands Messages
#=================================================================================================#
  Message: "{prefix}&cBạn không có quyền sử dụng lệnh &7/{command}&c."
  Command_Added: "{prefix}&7Bạn đã thêm lệnh &c{command} &7vào danh sách lệnh bị cấm."
  Command_Exists: "{prefix}&7Lệnh &c{command} &7đã được thêm vào danh sách lệnh bị cấm."
  Command_Removed: "{prefix}&7Bạn đã xóa lệnh &c{command} &7khỏi danh sách lệnh bị cấm."
  Command_Not_Found: "{prefix}&7Lệnh &c{command} &7không có trong danh sách lệnh bị cấm."
  Notify_Staff_Format: "&7[Blocked-Cmd] &f{player}: &7{command}"
  
Chat_Radius:
#=================================================================================================#
# Chat Radius Messages
#=================================================================================================#
  Local_Chat:
    Enabled: "{prefix}&7Bạn đã vào &cLocal Chat&7! Sử dụng &c/ChatRadius global &7hoặc &c/ChatRadius world &7để thoát Local Chat!"
    Already_Enabled: "{prefix}&7Bạn đã ở trong local chat."
  Global_Chat:
    Enabled: "{prefix}&7Bạn đã vào &cGlobal Chat&7! Sử dụng &c/ChatRadius local &7hoặc &c/ChatRadius world &7để thoát Global Chat!"
    Already_Enabled: "{prefix}&7Bạn đã ở trong global chat."
  World_Chat:
    Enabled: "{prefix}&7Bạn đã vào &cWorld Chat&7! Sử dụng &c/ChatRadius local &7hoặc &c/ChatRadius global &7để thoát World Chat!"
    Already_Enabled: "{prefix}&7Bạn đã ở trong world chat."
  Spy:
    Enabled: "{prefix}&7Tính năng theo dõi Chat Radius đã được &aBật."
    Disabled: "{prefix}&7Tính năng theo dõi Chat Radius đã được &cTắt."
  
Clear_Chat:
#=================================================================================================#
# Clear Chat Messages
#=================================================================================================#
  Staff_Message: "{prefix}&eChat đã được xóa bởi {player}."
  Broadcast_Message:
  - "&f*&c&m--------------------------------------------&f*"
  - "&eChat đã được xóa bởi {player}"
  - "&f*&c&m--------------------------------------------&f*"
  
Command_Spy:
#=================================================================================================#
# Command Spy Messages
#=================================================================================================#
  Format: "&7[Command-Spy] {player}: &b{command}"
  Enabled: "{prefix}&aCommand Spy đã được bật."
  Disabled: "{prefix}&cCommand Spy đã được tắt."
  
Mute_Chat:
#=================================================================================================#
# Mute Chat Messages
#=================================================================================================#
  Denied_Message: "{prefix}&cBạn không thể nói chuyện trong chat ngay bây giờ."
  Broadcast_Messages:
    Enabled: "{prefix}&aChat đã được bật bởi {player}."
    Disabled: "{prefix}&cChat đã được tắt bởi {player}."
  Blocked_Commands:
    Message: "{prefix}&cBạn không được phép sử dụng lệnh đó khi chat bị tắt."
    
Per_World_Chat:
#=================================================================================================#
# Per-World Chat Messages
#=================================================================================================#
  Bypass_Enabled: "{prefix}&aTính năng bỏ qua chat theo thế giới đã được bật."
  Bypass_Disabled: "{prefix}&cTính năng bỏ qua chat theo thế giới đã được tắt."
  
Ping:
#=================================================================================================#
# Ping Messages
#=================================================================================================#
  Players_Ping: "{prefix}&7Ping hiện tại của bạn là &c{ping} ms."
  Targets_Ping: "{prefix}&7Ping hiện tại của {target} là &c{ping} ms."
  
Private_Message:
#=================================================================================================#
# Private Message Messages
#=================================================================================================#
  Recipient_Not_Found: "{prefix}&cBạn không có ai để trả lời."
  Toggled: "{prefix}&cNgười chơi đó hiện không thể nhận tin nhắn."
  Ignored: "{prefix}&c{target} &7đang bỏ qua bạn và không thể nhận được bất kỳ tin nhắn riêng tư nào."
  Self: "{prefix}&cBạn không thể nhắn tin cho chính mình."
  AFK: "{prefix}&c{target} &7hiện đang vắng mặt."
  
Social_Spy:
#=================================================================================================#
# Social Spy Messages
#=================================================================================================#
  Format: "&b&l(*)&bSpy &f&l[&e{player} &d-> &e{receiver}&f&l] &b{message}"
  Enabled: "{prefix}&aSocial Spy đã được bật."
  Disabled: "{prefix}&cSocial Spy đã được tắt."
  
Staff_Chat:
#=================================================================================================#
# Staff Chat Messages
#=================================================================================================#
  Enabled: "{prefix}&aStaff chat đã được bật."
  Disabled: "{prefix}&cStaff chat đã được tắt."
  
Toggle_Chat:
#=================================================================================================#
# Toggle Chat Messages
#=================================================================================================#
  Enabled: "{prefix}&aChế độ bật/tắt chat đã được bật, bạn sẽ không còn nhận được tin nhắn chat nữa."
  Disabled: "{prefix}&cChế độ bật/tắt chat đã được tắt, bạn sẽ bắt đầu nhận được tin nhắn chat."
  
Toggle_Mentions:
#=================================================================================================#
# Toggle Mentions Messages
#=================================================================================================#
  Enabled: "{prefix}&7Chế độ bật/tắt nhắc đến đã được &abật&7, bạn sẽ không còn nhận được tin nhắn nhắc đến nữa."
  Disabled: "{prefix}&7Chế độ bật/tắt nhắc đến đã được &ctắt&7, bạn sẽ bắt đầu nhận được tin nhắn nhắc đến."
  
TogglePM:
#=================================================================================================#
# TogglePM Messages
#=================================================================================================#
  Enabled: "{prefix}&aTogglePM đã được bật."
  Disabled: "{prefix}&cTogglePM đã được tắt."
  Disabled: "{prefix}&cTogglePM has been disabled."