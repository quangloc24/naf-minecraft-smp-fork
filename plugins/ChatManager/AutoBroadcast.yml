Auto_Broadcast:
  Global_Messages:
    Enable: true
    Header_And_Footer: true
    Interval: 60
    Prefix: "&6[Tips] &r"
    Header: "&7*&7&m---------------------------------------------------&7*"
    Footer: "&7*&7&m---------------------------------------------------&7*"
    sound:
      toggle: false
      value: 'ENTITY_PLAYER_LEVELUP'
      pitch: 1
      volume: 1
    Messages:
      - "{prefix}&7Nhận bộ dụng cụ khởi đầu với &e/kit <kitname>&7."
      - "{prefix}&7Chặt cây và đào quặng nhanh hơn bằng cách giữ &eSNEAK &7và click trái!"
      - "{prefix}&7Muốn ngồi, nằm hoặc bò? Hãy thử &e/sit&7, &e/lay&7, &e/crawl&7 và nhiều hơn nữa!"
      - "{prefix}&7Gamerule keepInventory được đặt thành &cfalse&7. Hãy cẩn thận! Nếu bạn chết, bạn sẽ mất đồ. Tuy nhiên, máy chủ sẽ gửi cho bạn tọa độ tử vong."
      - "{prefix}&7Khám phá cuộc phiêu lưu! Những vật phẩm hiếm có thể được giấu trong các công trình và những nơi khác. Chúc săn tìm vui vẻ!"
      - "{prefix}&7Tham gia cộng đồng Discord của chúng tôi! Gõ &e/discord &7để có liên kết mời."
      - "{prefix}&7Muốn dịch chuyển ngẫu nhiên? Sử dụng &e/rtp&7 để tìm một vị trí mới ngay lập tức."
      - "{prefix}&7Dịch chuyển đến bạn bè của bạn dễ dàng với &e/tpa <player>&7 hoặc đưa họ đến chỗ bạn với &e/tpahere <player>&7."
      - "{prefix}&7Lưu các vị trí yêu thích của bạn bằng &e/sethome <name>&7 và quay lại bất cứ lúc nào với &e/home <name>&7."
      - "{prefix}&7Thấy ai đó hack hoặc gian lận? Quay video và báo cáo cho quản trị viên. Sự giúp đỡ của bạn rất được đánh giá cao!"
      - "{prefix}&7Cần AFK? Sử dụng &e/afk &7để vào chế độ AFK. Bạn sẽ không bị tấn công và bạn được miễn trừ khỏi yêu cầu ngủ."
      - "{prefix}&7Tham gia hoặc tạo một đội bằng &e/team create <name>&7. Các đội có thể chia sẻ rương, đặt điểm dịch chuyển và làm việc cùng nhau!"
      - "{prefix}&7Trăng máu xảy ra cứ sau 30 ngày, làm tăng tỷ lệ sinh quái vật và tỷ lệ rơi đồ. Sử dụng &e/bloodmoon show &7để kiểm tra khi nào lần tiếp theo xảy ra!"
      - "{prefix}&7Bình chọn để tắt tiếng, đá hoặc cấm người chơi bằng &e/votemute, /votekick, &7hoặc &e/voteban &7với lý do. Ít nhất 50% người chơi phải đồng ý!"
      - "{prefix}&7Tìm thấy lỗi? Báo cáo nó!"
      - "{prefix}&7Khởi hành nhiệm vụ! Sử dụng &e/quest &7để chọn từ 331 nhiệm vụ và kiếm phần thưởng tuyệt vời."
      - "{prefix}&7Muốn trò chuyện riêng tư? Sử dụng &e/msg <player> <message>&7 để gửi tin nhắn riêng tư và &e/r <message>&7 để trả lời."
      - "{prefix}&7Khám phá các sinh vật, công trình và trùm mới ở Nether và The End với thế giới được nâng cấp của chúng tôi:D"
      - "{prefix}&7Muốn vũ khí mới mạnh mẽ? Khám phá Nether và The End để tìm những con trùm và chiến lợi phẩm độc đáo. Xem hướng dẫn trên Discord để được hướng dẫn!"
      - "{prefix}&7Nâng cao trò chơi của bạn với Simple Voice Chat! Kiểm tra hướng dẫn cài đặt trên YouTube!"
      - "{prefix}&7Cần loại bỏ một số đồ bỏ đi? Sử dụng &e/trash&7 để loại bỏ chúng!"
      - "{prefix}&7Cần giúp đỡ? Đừng ngần ngại hỏi những người chơi hoặc nhân viên khác. Chúng ta là một cộng đồng thân thiện!"
      - "{prefix}&7Chia sẻ các vật phẩm hiếm với đội của bạn bằng &e/team echest&7!"
      - "{prefix}&7Thay đổi skin trong trò chơi bằng &e/skin <name>&7"
      - "{prefix}&7Đội bất cứ thứ gì lên đầu bằng &e/hat&7."
      - "{prefix}&7Sử dụng &e/spawn&7 để quay lại điểm xuất hiện của máy chủ."
      - "{prefix}&7Này Speedrunner! Chỉ cần chậm lại, dành thời gian của bạn và tận hưởng máy chủ. Có rất nhiều điều để khám phá!"
      - "{prefix}&7Kiểm tra tốc độ kết nối của bạn bằng &e/ping&7."
      - "{prefix}&7Kiểm tra tps của chúng tôi bằng &e/tps&7."
      - "{prefix}&7Để nâng cao trải nghiệm của bạn, Incendium và Stellarity có các gói tài nguyên riêng! Hãy chắc chắn cài đặt chúng để có hình ảnh đẹp nhất."
      - "{prefix}&7Đừng quên tham gia Discord của chúng tôi &9dsc.gg/nafd &7để biết những thông báo và hỗ trợ mới nhất!"
