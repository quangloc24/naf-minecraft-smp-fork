reload-message: "&a[BanWebhook] Reloaded Configuration!"
permanent-duration-translation: "Vĩnh viễn"
litebans-do-not-send-silent-punishments: true
inline-webhooks: true

ban:
  enabled: true
  webhook-url: "webhook"
  webhook-title: "{player} đã bị ban!"
  webhook-thumbnail: ""
  webhook-color: "ff0000"
  fields:
    "Player:": "{player}"
    "Banned by:": "{executor}"
    "Reason:": "{reason}"
    "Duration:": "{duration}"

mute:
  enabled: false
  webhook-url: "webhook"
  webhook-title: "{player} đã bị tắt tiếng!"
  webhook-thumbnail: ""
  webhook-color: "ffff00"
  fields:
    "Player:": "{player}"
    "Muted by:": "{executor}"
    "Reason:": "{reason}"
    "Duration:": "{duration}"

warn:
  enabled: false
  webhook-url: "webhook"
  webhook-title: "{player} đã bị cảnh cáo!"
  webhook-thumbnail: ""
  webhook-color: "ffff00"
  fields:
    "Player:": "{player}"
    "Warned by:": "{executor}"
    "Reason:": "{reason}"
    "Duration:": "{duration}"

kick:
  enabled: true
  webhook-url: "webhook"
  webhook-title: "{player} đã bị đá khỏi server!"
  webhook-thumbnail: ""
  webhook-color: "ff0000"
  fields:
    "Player:": "{player}"
    "Kicked by:": "{executor}"
    "Reason:": "{reason}"
    "Duration:": "{duration}"

unban:
  enabled: true
  webhook-url: "webhook"
  webhook-title: "{player} đã được unban!"
  webhook-thumbnail: ""
  webhook-color: "00ff00"
  fields:
    "Player:": "{player}"
    "Unbaned by:": "{executor}"
    "Reason:": "{reason}"

unmute:
  enabled: false
  webhook-url: "webhook"
  webhook-title: "{player} đã được bật tiếng!"
  webhook-thumbnail: ""
  webhook-color: "00ff00"
  fields:
    "Player:": "{player}"
    "Unmuted by:": "{executor}"
    "Reason:": "{reason}"

unwarn:
  enabled: false
  webhook-url: "webhook"
  webhook-title: "{player} đã được xóa cảnh cáo!"
  webhook-thumbnail: ""
  webhook-color: "00ff00"
